# Configuração do perfil local para testes. Reproduz application-local.properties mas
# sem classpath:db/seed no Flyway. Seeds de dev (V13, V16...) ficam aplicados no
# banco mas ausentes aqui — ignorar via ignore-migration-patterns.
# Manter sincronizado com src/main/resources/application-local.properties.

# Runtime roda como fintech_app (não-superuser) — ver application-local.properties
# principal e ADR-006. Flyway (owner das tabelas) segue com admin.
spring.datasource.url=jdbc:postgresql://localhost:5432/fintech
spring.datasource.username=fintech_app
spring.datasource.password=fintech_app_secret

spring.flyway.url=jdbc:postgresql://localhost:5432/fintech
spring.flyway.user=admin
spring.flyway.password=secret

# Limita o pool por contexto de teste para evitar esgotar max_connections=100
# do PostgreSQL quando múltiplos @SpringBootTest rodam simultaneamente.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:--}][%X{userId:--}] %logger{36} - %msg%n
logging.level.com.fintech=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

api.security.token.secret=dev-secret-key-not-for-production

cors.allowed-origins=http://localhost:4200

spring.flyway.locations=classpath:db/migration
# seeds (V13, V16, V18...) estão no banco mas não em db/migration — ignorar para não quebrar ctx de testes.
# *:missing → seeds com versão ABAIXO do máximo de db/migration; *:future → seeds ACIMA (ex.: V18 > V17).
spring.flyway.ignore-migration-patterns=*:missing,*:future
