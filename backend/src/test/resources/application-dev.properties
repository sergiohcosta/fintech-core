# Configuração do perfil dev para testes. Reproduz application-dev.properties mas
# sem classpath:db/seed no Flyway. Seeds de dev (V13, V16...) ficam aplicados no
# banco mas ausentes aqui — ignorar via ignore-migration-patterns.
# Manter sincronizado com src/main/resources/application-dev.properties.

spring.datasource.url=jdbc:postgresql://localhost:5432/fintech
spring.datasource.username=admin
spring.datasource.password=secret

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:--}][%X{userId:--}] %logger{36} - %msg%n
logging.level.com.fintech=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

api.security.token.secret=dev-secret-key-not-for-production

cors.allowed-origins=http://localhost:4200

spring.flyway.locations=classpath:db/migration
# seeds (V13, V16) estão no banco mas não em db/migration — ignorar para não quebrar ctx de testes
spring.flyway.ignore-migration-patterns=*:missing
