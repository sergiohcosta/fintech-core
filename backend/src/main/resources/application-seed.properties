# Perfil aditivo (combinar com prod: SPRING_PROFILES_ACTIVE=prod,seed) — carrega o
# dataset de teste (V13/V16 em db/seed) num ambiente que já usa datasource de prod
# (ex: namespace k8s "dev", que lê DATABASE_URL/DB_USERNAME/DB_PASSWORD via env vars).
spring.flyway.locations=classpath:db/migration,classpath:db/seed
