spring.application.name=fintech-api
spring.profiles.active=local
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
springdoc.api-docs.enabled=true
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html

# Import (extração/conciliação) — thresholds que derivam `requires_review` NO CÓDIGO
# (spec §2.f). O produto controla a régua aqui, sem depender do modelo. amount é o campo
# mais crítico, por isso threshold mais rígido que o agregado.
import.review.overall-threshold=0.90
import.review.amount-threshold=0.95
# Versão do prompt/extrator — vira proveniência (`extractor_version`) de todo batch extraído.
# Trocar o prompt = subir esta versão para rastrear qual regra gerou cada dado.
import.vision.extractor-version=2026-07-24
# Teto de saída do caminho de EXTRATO (#194, 2ª chamada, até statement.max-lines=60 linhas).
# Default do Spring AI (4096) é insuficiente: cada linha tem ~8 campos JSON com confiança
# por campo (~150-200 chars/linha) — 60 linhas estoura o teto e o Gemini corta a resposta
# no meio do JSON. Resposta truncada não fecha chave/aspas — nenhum ResponseTextCleaner do
# Spring AI (nem o MarkdownCodeBlockCleaner, que exige fence de abertura E fechamento) repara
# JSON incompleto, e o parse falha com uma mensagem genérica que esconde a causa real
# (achado em produção, 2026-08-25: extrato Itaú com dezenas de linhas truncou em ~4096 tokens).
import.vision.statement.max-output-tokens=8192
# Extrator OFX (Fase 2) é determinístico — a versão sobe só quando a LÓGICA do parser muda
# (diferente do vision, que versiona por prompt). "v1" = leitor tolerante SGML/XML inicial.
import.ofx.extractor-version=v1
# Extrator CSV genérico (Fase 2) — também determinístico; versiona quando as heurísticas de
# header/charset/decimal mudam, não por prompt (não há modelo aqui).
import.csv.extractor-version=v1
# PDF escaneado (Fase 3, fatia 3) — rasteriza cada página e delega ao VisionExtractor.
# max-pages: fail-fast antes de qualquer chamada de IA (custo parcial de um documento acima
# do limite não reverteria em nada aproveitável). render-dpi: 150 é chute inicial, não
# calibrado contra fatura brasileira real.
import.pdf-scanned.max-pages=10
import.pdf-scanned.render-dpi=150

# Spring AI / Ollama — extração de visão (Fase 1). AGNÓSTICO de provider: trocar de Ollama
# para outro modelo é trocar o starter Maven + estas properties, sem tocar no código.
# base-url e model são env vars (prod aponta pro Ollama do homelab); SEM chave de API.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
# Modelo default = llama3.2-vision: cabe nos 11GB da GPU do homelab (1x GTX 1080 Ti) e lê
# comprovante BR bem. (qwen2.5vl:7b NÃO cabe — 14GB, estoura a VRAM no passo de visão →
# SIGSEGV; minicpm-v e qwen2.5vl:3b degeneram no Ollama atual. Ver validação E2E jul/2026.)
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2-vision}
# Temperatura baixa: extração é tarefa determinística (ler o comprovante), não criativa.
spring.ai.ollama.chat.options.temperature=0.1
# num-ctx enxuto: 1 comprovante não precisa de janela grande, e o buffer de compute do ggml
# cresce com num-ctx. Com 4096 o llama3.2-vision roda 100% na GPU (~9GB); valores altos
# estouram a VRAM no passo de visão (cudaMalloc OOM → SIGSEGV do runner).
spring.ai.ollama.chat.options.num-ctx=4096
# format=json força o Ollama a emitir JSON válido. Sem isso, o llama3.2-vision descreve a
# imagem em PROSA e o BeanOutputConverter do Spring AI (.entity) não parseia → batch FAILED.
# O .entity já injeta os campos/schema no prompt; este flag garante que a SAÍDA seja JSON.
spring.ai.ollama.chat.options.format=json
# NUNCA baixar modelo no boot — o servidor Ollama é responsabilidade de ops. Sem isso o
# contexto Spring (inclusive os testes @SpringBootTest) tentaria falar com o Ollama ao subir.
spring.ai.ollama.init.pull-model-strategy=never
# Retry curto: se o provider de visão falha (modelo não sobe/timeout), insistir 10x (default
# do Spring AI) só prende o usuário no spinner por minutos. Falha rápido → batch FAILED →
# fallback manual (erro explícito > erro silencioso).
spring.ai.retry.max-attempts=2

# Spring AI / Gemini (Google AI Studio, tier free) — Onda 2 do plano "extração Gemini primário /
# Ollama fallback". Provider GERENCIADO: some do classpath quando GEMINI_API_KEY não é definida
# (ver GeminiVisionClient — @ConditionalOnExpression checa o VALOR, não só a presença da key).
# NÃO definir project-id/location aqui: eles forçam o modo Vertex AI, e a chave do AI Studio é
# rejeitada com 400 nesse modo (a chave do AI Studio só vale no modo "API key direta").
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
# gemini-2.5-flash: Flash do tier free na família 2.5 (gemini-2.0-flash foi aposentado em
# mar/2026 — ID de modelo tem prazo de validade, por isso é trocável via env var sem redeploy).
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=0.1

# Upload de comprovante — teto de tamanho (imagem única de comprovante é pequena).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
