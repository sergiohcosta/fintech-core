spring.application.name=fintech-api
spring.profiles.active=local
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
springdoc.api-docs.enabled=true
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.path=/swagger-ui.html

# Import (extração/conciliação) — thresholds que derivam `requires_review` NO CÓDIGO
# (spec §2.f). O produto controla a régua aqui, sem depender do modelo. amount é o campo
# mais crítico, por isso threshold mais rígido que o agregado.
import.review.overall-threshold=0.90
import.review.amount-threshold=0.95
