# Namespace k8s "dev". Datasource via env vars injetadas pelo ConfigMap/Secret
# (homelab-k8s/projects/fintech-core/overlays/dev) — não Neon/Render, migrado
# no ADR-004 pra k3s homelab + GHCR.
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000

spring.jpa.show-sql=false

# Logging — JSON estruturado (Spring Boot 4.0 nativo, parseable por qualquer agregador de logs)
logging.structured.format.console=logstash
logging.level.com.fintech=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

api.security.token.secret=${JWT_SECRET}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Link de convite/recuperação de senha no email. Sem override aqui antes, os dois caíam no
# default de localhost:4200 (InvitationService/PasswordResetService) mesmo em dev/hmg/prod —
# achado real testando recuperação de senha contra prod. Mesma origem do CORS por padrão
# (é o mesmo frontend), mas FRONTEND_URL própria pra não acoplar os dois conceitos pra sempre.
app.frontend.url=${FRONTEND_URL:${cors.allowed-origins}}

# Único dos 3 namespaces k8s com o dataset de teste (Família Costa) — hmg/prod ficam
# só com o schema, sem dado fake.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
