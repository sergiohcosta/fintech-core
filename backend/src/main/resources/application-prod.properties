
# Namespace k8s "prod". Datasource via env vars injetadas pelo ConfigMap/Secret
# (homelab-k8s/projects/fintech-core/overlays/prod).
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000

# Produção: sem SQL no log, sem devtools
spring.jpa.show-sql=false

# Logging — JSON estruturado (Spring Boot 4.0 nativo, parseable por qualquer agregador de logs)
logging.structured.format.console=logstash
logging.level.com.fintech=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# JWT
api.security.token.secret=${JWT_SECRET}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Extração de visão — prod aponta para o Ollama do homelab via env vars (OLLAMA_BASE_URL /
# OLLAMA_MODEL injetadas pelo ConfigMap/Secret). Herda os defaults da application.properties
# (base-url/model já leem env var); reafirmado aqui como ponto de configuração explícito do
# ambiente. Sem chave de API — modelo grátis no homelab.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2-vision}

# Gemini — provider primário em prod (Onda 2). GEMINI_API_KEY é OBRIGATÓRIA via env (sem default
# aqui, mesmo padrão do OLLAMA_BASE_URL acima) — Secret do k8s injeta o valor; sem ela, o
# GeminiVisionClient simplesmente não existe no contexto e o Ollama segue como único provider
# (degradação segura, não erro de boot).
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
