openapi: 3.0.3
info:
  title: Fintech SaaS API
  version: 1.0.0
  description: API de gestão financeira multi-tenant.

servers:
  - url: http://localhost:8080
    description: Desenvolvimento local

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # --- Enums ---

    TransactionType:
      type: string
      enum: [INCOME, EXPENSE]

    TransactionStatus:
      type: string
      enum: [PENDING, PAID, CANCELLED]

    InvoiceStatus:
      type: string
      enum: [OPEN, CLOSED, PAID]

    CardBrand:
      type: string
      enum: [VISA, MASTERCARD, ELO, AMEX, HIPERCARD, OTHER]

    RecurrenceStatus:
      type: string
      enum: [ACTIVE, CANCELLED]

    ImportMode:
      type: string
      enum: [NEW_TRANSACTIONS, RECONCILIATION]

    ImportSourceType:
      type: string
      enum: [IMAGE, PDF_TEXT, PDF_SCANNED, CSV, OFX, AUDIO]

    ImportBatchStatus:
      type: string
      enum: [PENDING, EXTRACTED, REVIEWED, COMMITTED, FAILED]

    StagedTransactionStatus:
      type: string
      enum: [PENDING, CONFIRMED, DISCARDED]

    # --- Auth ---

    LoginDTO:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LoginResponseDTO:
      type: object
      properties:
        token:
          type: string

    TenantRegistrationDTO:
      type: object
      required: [name, adminName, adminEmail, password]
      properties:
        name:
          type: string
        document:
          type: string
          nullable: true
        adminName:
          type: string
        adminEmail:
          type: string
          format: email
        password:
          type: string

    RegisterResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    # --- Categories ---

    CategoryCreateDTO:
      type: object
      required: [name, icon, color]
      properties:
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
        taxonomyCode:
          type: string
          nullable: true
          description: "Código de taxonomia padrão. null = não alterar valor existente."

    CategoryResponseDTO:
      type: object
      required: [id, name, icon, color, archived, children]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
        archived:
          type: boolean
        taxonomyCode:
          type: string
          nullable: true
          description: "Código semântico estável para benchmarking cross-tenant. null = categoria criada pelo usuário."
          example: "HOUSING"
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponseDTO'

    CategoryArchiveRequest:
      type: object
      properties:
        targetCategoryId:
          type: string
          format: uuid
          nullable: true

    CategoryConflictResponse:
      type: object
      required: [transactionCount, message]
      properties:
        transactionCount:
          type: integer
          format: int64
        message:
          type: string

    # --- Transactions ---

    TransactionRequestDTO:
      type: object
      required: [description, amount, date, type, accountId]
      properties:
        description:
          type: string
        amount:
          type: number
          format: double
          minimum: 0.01
        date:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
          nullable: true
        totalInstallments:
          type: integer
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        accountId:
          type: string
          format: uuid

    TransactionUpdateDTO:
      type: object
      properties:
        description:
          type: string
          nullable: true
        amount:
          type: number
          format: double
          minimum: 0.01
          nullable: true
        date:
          type: string
          format: date
          nullable: true
        type:
          $ref: '#/components/schemas/TransactionType'
          nullable: true
        status:
          $ref: '#/components/schemas/TransactionStatus'
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        accountId:
          type: string
          format: uuid
          nullable: true
        propagate:
          type: array
          items:
            type: string
          nullable: true

    TransactionResponseDTO:
      type: object
      required: [id, description, amount, date, type, status]
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        amount:
          type: number
          format: double
        date:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        installmentLabel:
          type: string
          nullable: true
        categoryName:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        categoryArchived:
          type: boolean
        categoryPath:
          type: string
          nullable: true
        categoryIcon:
          type: string
          nullable: true
        accountName:
          type: string
          nullable: true
        accountId:
          type: string
          format: uuid
          nullable: true
        transferId:
          type: string
          format: uuid
          nullable: true
        installmentGroupId:
          type: string
          format: uuid
          nullable: true
        installmentGroupDescription:
          type: string
          nullable: true
        installmentNumber:
          type: integer
          nullable: true
        totalInstallments:
          type: integer
          nullable: true
        invoiceId:
          type: string
          format: uuid
          nullable: true
        invoiceDueDate:
          type: string
          format: date
          nullable: true
        invoiceStatus:
          $ref: '#/components/schemas/InvoiceStatus'
          nullable: true
        projected:
          type: boolean
          description: true = "linha fantasma" projetada de uma regra (não existe no banco)
        recurrenceRuleId:
          type: string
          format: uuid
          nullable: true
        occurrenceDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true

    # --- Invoices ---

    InvoiceResponseDTO:
      type: object
      required: [id, accountId, accountName, referenceMonth, referenceYear, label, closingDate, dueDate, status, totalAmount, transactionCount]
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        referenceMonth:
          type: integer
        referenceYear:
          type: integer
        label:
          type: string
          example: "Janeiro/2027"
        closingDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        totalAmount:
          type: number
          format: double
        transactionCount:
          type: integer
          format: int64

    InvoicePayDTO:
      type: object
      required:
        - sourceAccountId
      properties:
        sourceAccountId:
          type: string
          format: uuid

    DeleteInstallmentScope:
      type: string
      enum: [SINGLE, THIS_AND_NEXT, ALL]
      default: SINGLE

    DeleteInstallmentResultDTO:
      type: object
      required: [deleted, skippedPaid]
      properties:
        deleted:
          type: integer
        skippedPaid:
          type: integer

    InstallmentGroupPatchDTO:
      type: object
      properties:
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        accountId:
          type: string
          format: uuid
          nullable: true
        installmentAmount:
          type: number
          format: double
          nullable: true
        status:
          $ref: '#/components/schemas/TransactionStatus'
          nullable: true
        fields:
          type: array
          items:
            type: string

    InstallmentGroupResponseDTO:
      type: object
      required: [id, description, totalAmount, installmentAmount, totalInstallments, paidInstallments, pendingInstallments, accountName, transactions]
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        totalAmount:
          type: number
          format: double
        installmentAmount:
          type: number
          format: double
        totalInstallments:
          type: integer
        paidInstallments:
          type: integer
          format: int64
        pendingInstallments:
          type: integer
          format: int64
        nextDueDate:
          type: string
          format: date
          nullable: true
        categoryName:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        accountName:
          type: string
        accountId:
          type: string
          format: uuid
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponseDTO'

    TransferRequest:
      type: object
      required: [fromAccountId, toAccountId, amount, date]
      properties:
        fromAccountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          minimum: 0.01
        date:
          type: string
          format: date
        description:
          type: string
          nullable: true

    TransferResponse:
      type: object
      properties:
        transferId:
          type: string
          format: uuid
        fromLegId:
          type: string
          format: uuid
        toLegId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        date:
          type: string
          format: date
        description:
          type: string
        fromAccount:
          type: string
        toAccount:
          type: string

    # --- Dashboard ---

    DashboardSummaryDTO:
      type: object
      properties:
        period:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: "2026-05"
        totalIncome:
          type: number
          format: double
        totalExpense:
          type: number
          format: double
        balance:
          type: number
          format: double
        transactionCount:
          type: integer
          format: int64
          description: Quantidade de transações não canceladas no período. Zero indica mês sem movimentação.
        totalAccountBalance:
          type: number
          format: double
          description: Saldo líquido acumulado (todas as contas com countInLiquidBalance=true, sem filtro de período).

    # --- Accounts ---

    AccountType:
      type: string
      enum: [CHECKING, INVESTMENT, CREDIT_CARD, CASH]

    CreditCardDetailsRequest:
      type: object
      properties:
        brand:
          $ref: '#/components/schemas/CardBrand'
        lastFourDigits:
          type: string
          minLength: 4
          maxLength: 4
          nullable: true
        limitAmount:
          type: number
          format: double
          nullable: true
        closingDay:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
        dueDay:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true

    CreditCardDetailsResponse:
      type: object
      required: [closingDay, dueDay]
      properties:
        brand:
          oneOf:
            - $ref: '#/components/schemas/CardBrand'
          nullable: true
        lastFourDigits:
          type: string
          nullable: true
        limitAmount:
          type: number
          format: double
          nullable: true
        closingDay:
          type: integer
        dueDay:
          type: integer

    AccountCreateRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/AccountType'
        color:
          type: string
          pattern: '^#([A-Fa-f0-9]{6})$'
          nullable: true
        icon:
          type: string
          nullable: true
        countInLiquidBalance:
          type: boolean
          nullable: true
        countInNetWorth:
          type: boolean
          nullable: true
        creditCardDetails:
          oneOf:
            - $ref: '#/components/schemas/CreditCardDetailsRequest'
          nullable: true

    AccountUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          nullable: true
        color:
          type: string
          pattern: '^#([A-Fa-f0-9]{6})$'
          nullable: true
        icon:
          type: string
          nullable: true
        countInLiquidBalance:
          type: boolean
          nullable: true
        countInNetWorth:
          type: boolean
          nullable: true
        creditCardDetails:
          oneOf:
            - $ref: '#/components/schemas/CreditCardDetailsRequest'
          nullable: true

    AccountResponse:
      type: object
      required: [id, name, type, countInLiquidBalance, countInNetWorth, active, balance]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        countInLiquidBalance:
          type: boolean
        countInNetWorth:
          type: boolean
        active:
          type: boolean
        balance:
          type: number
          format: double
        creditCardDetails:
          oneOf:
            - $ref: '#/components/schemas/CreditCardDetailsResponse'
          nullable: true

    # --- Budget Planning ---

    BudgetCycleStatus:
      type: string
      enum: [OPEN, CLOSED]

    BudgetItemSource:
      type: string
      enum: [MANUAL, RECURRING, INSTALLMENT]

    BudgetItemStatus:
      type: string
      enum: [PENDING, REALIZED, SKIPPED]

    BudgetCycleOpenRequest:
      type: object
      required: [referenceMonth]
      properties:
        referenceMonth:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: "2026-06"

    BudgetCycleSummary:
      type: object
      properties:
        plannedIncome:
          type: number
          format: double
        plannedExpense:
          type: number
          format: double
        projectedBalance:
          type: number
          format: double
        realizedIncome:
          type: number
          format: double
        realizedExpense:
          type: number
          format: double
        currentBalance:
          type: number
          format: double
        pendingCount:
          type: integer
        unplannedIncome:
          type: number
          format: double
        unplannedExpense:
          type: number
          format: double
        availableToSpend:
          type: number
          format: double
        dailyAllowance:
          type: number
          format: double
          nullable: true
        remainingDays:
          type: integer
          nullable: true

    BudgetItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        amount:
          type: number
          format: double
        type:
          $ref: '#/components/schemas/TransactionType'
        expectedDate:
          type: string
          format: date
        source:
          $ref: '#/components/schemas/BudgetItemSource'
        status:
          $ref: '#/components/schemas/BudgetItemStatus'
        categoryId:
          type: string
          format: uuid
          nullable: true
        categoryName:
          type: string
          nullable: true
        accountId:
          type: string
          format: uuid
          nullable: true
        accountName:
          type: string
          nullable: true
        transactionId:
          type: string
          format: uuid
          nullable: true
        transactionStatus:
          $ref: '#/components/schemas/TransactionStatus'
          nullable: true
        installmentGroupId:
          type: string
          format: uuid
          nullable: true
        recurrenceRuleId:
          type: string
          format: uuid
          nullable: true
        recurrenceOccurrenceDate:
          type: string
          format: date
          nullable: true

    BudgetCycleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        openingBalance:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/BudgetCycleStatus'
        summary:
          $ref: '#/components/schemas/BudgetCycleSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/BudgetItemResponse'
        unplannedTransactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponseDTO'

    BudgetItemCreateRequest:
      type: object
      required: [description, amount, type, expectedDate]
      properties:
        description:
          type: string
        amount:
          type: number
          format: double
        type:
          $ref: '#/components/schemas/TransactionType'
        expectedDate:
          type: string
          format: date
        categoryId:
          type: string
          format: uuid
          nullable: true
        accountId:
          type: string
          format: uuid
          nullable: true

    BudgetItemUpdateRequest:
      type: object
      required: [description, amount, expectedDate]
      properties:
        description:
          type: string
        amount:
          type: number
          format: double
        expectedDate:
          type: string
          format: date
        categoryId:
          type: string
          format: uuid
          nullable: true
        accountId:
          type: string
          format: uuid
          nullable: true

    BudgetItemLinkRequest:
      type: object
      required: [transactionId]
      properties:
        transactionId:
          type: string
          format: uuid

    TenantSettingsPatchRequest:
      type: object
      required: [budgetCycleStartDay]
      properties:
        budgetCycleStartDay:
          type: integer
          minimum: 1
          maximum: 28

    BudgetCyclePageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BudgetCycleResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        number:
          type: integer

    # --- Recorrência ---

    RecurrenceRuleCreateDTO:
      type: object
      required: [description, baseAmount, type, accountId, rrule, startDate]
      properties:
        description:
          type: string
          maxLength: 255
        baseAmount:
          type: number
          format: double
        type:
          $ref: '#/components/schemas/TransactionType'
        categoryId:
          type: string
          format: uuid
          nullable: true
        accountId:
          type: string
          format: uuid
        rrule:
          type: string
          example: 'FREQ=MONTHLY;BYMONTHDAY=15'
        startDate:
          type: string
          format: date

    RecurrenceRulePatchDTO:
      type: object
      properties:
        description:
          type: string
          maxLength: 255
        baseAmount:
          type: number
          format: double

    ConfirmOccurrenceDTO:
      type: object
      properties:
        amount:
          type: number
          format: double
          nullable: true
        date:
          type: string
          format: date
          nullable: true

    RecurrenceRuleResponseDTO:
      type: object
      required: [id, description, baseAmount, type, accountId, accountName, rrule, startDate, status]
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        baseAmount:
          type: number
          format: double
        type:
          $ref: '#/components/schemas/TransactionType'
        categoryId:
          type: string
          format: uuid
          nullable: true
        categoryName:
          type: string
          nullable: true
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        rrule:
          type: string
        startDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/RecurrenceStatus'

    # --- Importação / Extração (Fase 0 — Fundação) ---

    StagedFieldValueDTO:
      type: object
      description: Par {value, confidence} de um campo extraído (contrato normalizado §1.3).
      required: [confidence]
      properties:
        value:
          description: >-
            Valor extraído do campo. Tipo heterogêneo por campo (número para amount,
            string ISO para datas, string livre para description).
          nullable: true
        confidence:
          type: number
          format: double

    NormalizedTransactionDTO:
      type: object
      description: Uma transação no schema normalizado — formato para o qual todo extrator converge.
      required: [fields]
      properties:
        transactionId:
          type: string
          format: uuid
          nullable: true
        fields:
          type: object
          description: '{value, confidence} por campo, keyed pelo nome (amount, currency, transaction_date, posting_date, description, direction, payment_method).'
          additionalProperties:
            $ref: '#/components/schemas/StagedFieldValueDTO'
        suggestedCategoryCode:
          type: string
          nullable: true
        suggestedCategoryConfidence:
          type: number
          format: double
          nullable: true
        overallConfidence:
          type: number
          format: double
          nullable: true
        requiresReview:
          type: boolean
          nullable: true
          description: Informativo — no create o backend DERIVA por threshold (§2.f), ignorando este valor.
        duplicateCandidateOf:
          type: string
          format: uuid
          nullable: true

    NormalizedBatchDTO:
      type: object
      description: Batch normalizado de entrada — proveniência + lista de transações extraídas.
      required: [importMode, sourceType, transactions]
      properties:
        importMode:
          $ref: '#/components/schemas/ImportMode'
        sourceType:
          $ref: '#/components/schemas/ImportSourceType'
        extractorUsed:
          type: string
          nullable: true
        extractorVersion:
          type: string
          nullable: true
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/NormalizedTransactionDTO'

    ImportBatchResponseDTO:
      type: object
      required: [id, importMode, sourceType, status]
      properties:
        id:
          type: string
          format: uuid
        importMode:
          $ref: '#/components/schemas/ImportMode'
        sourceType:
          $ref: '#/components/schemas/ImportSourceType'
        extractorUsed:
          type: string
          nullable: true
        extractorVersion:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ImportBatchStatus'
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    StagedTransactionResponseDTO:
      type: object
      required: [id, batchId, fields, requiresReview, status]
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StagedFieldValueDTO'
        suggestedCategoryCode:
          type: string
          nullable: true
        suggestedCategoryConfidence:
          type: number
          format: double
          nullable: true
        overallConfidence:
          type: number
          format: double
          nullable: true
        requiresReview:
          type: boolean
        duplicateCandidateOf:
          type: string
          format: uuid
          nullable: true
        promotedTransactionId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/StagedTransactionStatus'
        createdAt:
          type: string
          format: date-time
          nullable: true

    # --- Importação / Extração (Fase 1 — MVP de imagem) ---

    StagedCommitItemDTO:
      type: object
      description: Instrução de commit de uma staged — em qual conta lançar e (opcional) categoria.
      required: [stagedId, accountId]
      properties:
        stagedId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true

    ImportCommitRequestDTO:
      type: object
      description: Lista de staged a promover a Transaction (só as listadas são lançadas).
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StagedCommitItemDTO'

    StagedPatchDTO:
      type: object
      description: >-
        Correções do usuário a uma staged antes de lançar. `fields` é um mapa parcial
        {nomeDoCampo: novoValor} (só o valor); o backend grava confiança 1.0 (dado confirmado
        por humano) e re-deriva requires_review.
      properties:
        fields:
          type: object
          nullable: true
          additionalProperties: true
        suggestedCategoryCode:
          type: string
          nullable: true

paths:

  # --- Auth (sem autenticação) ---

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
      responses:
        '200':
          description: Token JWT gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDTO'
        '401':
          description: Credenciais inválidas

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRegistrationDTO'
      responses:
        '201':
          description: Tenant e usuário admin criados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponseDTO'

  # --- Categories ---

  /api/categories:
    get:
      tags: [categories]
      operationId: listCategories
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Lista de categorias raiz com filhos aninhados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponseDTO'
    post:
      tags: [categories]
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateDTO'
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponseDTO'

  /api/categories/{id}:
    get:
      tags: [categories]
      operationId: getCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Categoria encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponseDTO'
        '404':
          description: Categoria não encontrada
    put:
      tags: [categories]
      operationId: updateCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateDTO'
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponseDTO'
        '404':
          description: Categoria não encontrada
    delete:
      tags: [categories]
      operationId: deleteCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Categoria removida (soft delete)
        '404':
          description: Categoria não encontrada
        '409':
          description: Categoria possui transações — frontend deve exibir modal de escolha (body contém transactionCount)

  /api/categories/{id}/archive:
    post:
      tags: [categories]
      operationId: archiveCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryArchiveRequest'
      responses:
        '204':
          description: Categoria arquivada (com ou sem reassociação de transações)
        '404':
          description: Categoria ou categoria destino não encontrada
        '400':
          description: targetCategoryId inválido (descendente da categoria sendo arquivada)

  # --- Transactions ---

  /api/transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      parameters:
        - name: invoiceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: accountIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: includeProjected
          in: query
          required: false
          description: Mescla as "linhas fantasma" das regras de recorrência (default false)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Lista de transações do tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponseDTO'
    post:
      tags: [transactions]
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequestDTO'
      responses:
        '201':
          description: Transação(ões) criada(s) — múltiplas em caso de parcelamento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponseDTO'

  /api/transactions/{id}:
    get:
      tags: [transactions]
      operationId: getTransaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transação encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponseDTO'
        '404':
          description: Transação não encontrada
    put:
      tags: [transactions]
      operationId: updateTransaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdateDTO'
      responses:
        '200':
          description: Transação atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponseDTO'
        '404':
          description: Transação não encontrada
    delete:
      tags: [transactions]
      operationId: deleteTransaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: scope
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DeleteInstallmentScope'
      responses:
        '200':
          description: Resultado da exclusão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInstallmentResultDTO'
        '404':
          description: Transação não encontrada

  # --- Dashboard ---

  /api/dashboard/summary:
    get:
      tags: [dashboard]
      operationId: getDashboardSummary
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
          example: "2026-05"
          description: Mês no formato yyyy-MM
      responses:
        '200':
          description: Resumo financeiro do período
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryDTO'
        '400':
          description: Formato do parâmetro month inválido

  # --- Accounts ---

  /api/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      responses:
        '200':
          description: Lista de contas ativas do tenant (com saldo calculado)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
    post:
      tags: [accounts]
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'

  /api/accounts/{id}:
    get:
      tags: [accounts]
      operationId: getAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conta encontrada com saldo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Conta não encontrada
    put:
      tags: [accounts]
      operationId: updateAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Conta não encontrada
    delete:
      tags: [accounts]
      operationId: deleteAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Conta arquivada (soft-delete)
        '404':
          description: Conta não encontrada

  # --- Transfers ---

  /api/transfers:
    post:
      tags: [transfers]
      operationId: createTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: Transferência criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          description: Contas iguais ou dados inválidos

  /api/transfers/{transferId}:
    delete:
      tags: [transfers]
      operationId: deleteTransfer
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Transferência excluída
        '404':
          description: Transferência não encontrada

  /api/installment-groups:
    get:
      tags: [installment-groups]
      operationId: listInstallmentGroups
      responses:
        '200':
          description: Lista de grupos de parcelamento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstallmentGroupResponseDTO'

  /api/installment-groups/{id}:
    get:
      tags: [installment-groups]
      operationId: getInstallmentGroup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhe do grupo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentGroupResponseDTO'
        '404':
          description: Grupo não encontrado
    delete:
      tags: [installment-groups]
      operationId: deleteInstallmentGroup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resultado da exclusão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteInstallmentResultDTO'
        '404':
          description: Grupo não encontrado
    patch:
      tags: [installment-groups]
      operationId: patchInstallmentGroup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallmentGroupPatchDTO'
      responses:
        '200':
          description: Grupo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentGroupResponseDTO'

  # --- Invoices ---

  /api/invoices:
    get:
      tags: [invoices]
      operationId: listInvoices
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de faturas da conta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponseDTO'

  /api/invoices/{id}:
    get:
      tags: [invoices]
      operationId: getInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhe da fatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseDTO'

  /api/invoices/{id}/close:
    post:
      tags: [invoices]
      operationId: closeInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fatura fechada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseDTO'

  /api/invoices/{id}/pay:
    post:
      tags: [invoices]
      operationId: payInvoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePayDTO'
      responses:
        '200':
          description: Fatura paga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseDTO'

  # --- Tenant Settings ---

  /api/tenant/settings:
    get:
      tags: [tenant]
      operationId: getTenantSettings
      responses:
        '200':
          description: Configurações do tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingsPatchRequest'
    patch:
      tags: [tenant]
      operationId: patchTenantSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSettingsPatchRequest'
      responses:
        '204':
          description: Configurações atualizadas

  # --- Budget Cycles ---

  /api/budget-cycles:
    get:
      tags: [budget]
      operationId: listBudgetCycles
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 12
      responses:
        '200':
          description: Histórico de ciclos paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCyclePageResponse'
    post:
      tags: [budget]
      operationId: openBudgetCycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCycleOpenRequest'
      responses:
        '201':
          description: Ciclo aberto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCycleResponse'
        '409':
          description: Ciclo já existe ou período conflita

  /api/budget-cycles/current:
    get:
      tags: [budget]
      operationId: getCurrentBudgetCycle
      responses:
        '200':
          description: Ciclo OPEN atual com itens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCycleResponse'
        '404':
          description: Nenhum ciclo aberto

  /api/budget-cycles/{id}:
    get:
      tags: [budget]
      operationId: getBudgetCycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ciclo com itens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCycleResponse'
    delete:
      tags: [budget]
      operationId: deleteBudgetCycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Ciclo excluído
        '422':
          description: Ciclo em aberto não pode ser excluído

  /api/budget-cycles/{id}/close:
    post:
      tags: [budget]
      operationId: closeBudgetCycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Ciclo fechado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCycleResponse'
        '409':
          description: Ciclo ainda em andamento — use force=true para confirmar

  /api/budget-cycles/{id}/sync-installments:
    post:
      tags: [budget]
      operationId: syncInstallments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Parcelas sincronizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCycleResponse'

  /api/budget-cycles/{cycleId}/items:
    get:
      tags: [budget]
      operationId: listBudgetItems
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de itens do ciclo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetItemResponse'
    post:
      tags: [budget]
      operationId: createBudgetItem
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetItemCreateRequest'
      responses:
        '201':
          description: Item criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetItemResponse'

  /api/budget-items/{id}:
    put:
      tags: [budget]
      operationId: updateBudgetItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetItemUpdateRequest'
      responses:
        '200':
          description: Item atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetItemResponse'
    delete:
      tags: [budget]
      operationId: deleteBudgetItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Item removido

  /api/budget-items/{id}/link:
    post:
      tags: [budget]
      operationId: linkBudgetItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetItemLinkRequest'
      responses:
        '200':
          description: Transação vinculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetItemResponse'
    delete:
      tags: [budget]
      operationId: unlinkBudgetItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transação desvinculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetItemResponse'

  # --- Recorrência (Motor de Recorrência — núcleo) ---

  /api/recurrence-rules:
    get:
      tags: [recurrence-rules]
      operationId: listRecurrenceRules
      summary: Lista as regras de recorrência ativas do tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurrenceRuleResponseDTO'
    post:
      tags: [recurrence-rules]
      operationId: createRecurrenceRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurrenceRuleCreateDTO'
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurrenceRuleResponseDTO'

  /api/recurrence-rules/{id}:
    get:
      tags: [recurrence-rules]
      operationId: getRecurrenceRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurrenceRuleResponseDTO'
    patch:
      tags: [recurrence-rules]
      operationId: patchRecurrenceRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurrenceRulePatchDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurrenceRuleResponseDTO'
    delete:
      tags: [recurrence-rules]
      operationId: cancelRecurrenceRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Cancelada

  /api/recurrence-rules/{id}/reactivate:
    patch:
      tags: [recurrence-rules]
      operationId: reactivateRecurrenceRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Regra reativada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurrenceRuleResponseDTO'
        '422':
          description: Regra já está ativa

  /api/recurrence-rules/{id}/occurrences/{date}/confirm:
    post:
      tags: [recurrence-rules]
      operationId: confirmOccurrence
      summary: Materializa uma ocorrência da regra como transação real
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmOccurrenceDTO'
      responses:
        '201':
          description: Ocorrência materializada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponseDTO'

  /api/recurrence-rules/{id}/occurrences/{date}/skip:
    post:
      tags: [recurrence-rules]
      operationId: skipOccurrence
      summary: Pula uma ocorrência (grava EXDATE)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '204':
          description: Ocorrência pulada (EXDATE gravada)

  # --- Importação / Extração (Fase 0 — Fundação) ---

  /api/imports/mock:
    post:
      tags: [imports]
      operationId: createMockImport
      summary: (dev) Cria um batch a partir de um schema normalizado mockado
      description: >-
        Prova o pipeline ponta a ponta sem extrator real. Grava o batch (EXTRACTED) e as
        transações em staging (PENDING), derivando requires_review por threshold no backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormalizedBatchDTO'
      responses:
        '201':
          description: Batch criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchResponseDTO'

  /api/imports/{id}:
    get:
      tags: [imports]
      operationId: getImport
      summary: Detalhe de um batch de importação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchResponseDTO'
        '404':
          description: Batch não encontrado (ou de outro tenant)

  /api/imports/{id}/staged:
    get:
      tags: [imports]
      operationId: listImportStaged
      summary: Lista as transações em staging de um batch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StagedTransactionResponseDTO'
        '404':
          description: Batch não encontrado (ou de outro tenant)

  /api/imports:
    post:
      tags: [imports]
      operationId: createImport
      summary: Extrai um comprovante (imagem) e cria um batch com a transação em staging
      description: >-
        Multipart: envia a imagem (file) + o modo de importação. Aciona o VisionExtractor
        (Spring AI + Ollama), grava o batch EXTRACTED e a transação em staging (PENDING),
        derivando requires_review por threshold no backend. Falha de extração grava o batch
        como FAILED (o fallback é o formulário manual de transação).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, importMode]
              properties:
                file:
                  type: string
                  format: binary
                  description: Imagem do comprovante (image/*).
                importMode:
                  $ref: '#/components/schemas/ImportMode'
      responses:
        '201':
          description: Batch criado (EXTRACTED) — ou FAILED se a extração não produziu dados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchResponseDTO'
        '400':
          description: Arquivo ausente ou tipo não suportado (não é imagem)

  /api/imports/{id}/staged/{stagedId}:
    patch:
      tags: [imports]
      operationId: patchImportStaged
      summary: Edita os campos de uma transação em staging antes de lançar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: stagedId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StagedPatchDTO'
      responses:
        '200':
          description: Staged atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagedTransactionResponseDTO'
        '404':
          description: Batch ou staged não encontrado (ou de outro tenant)

  /api/imports/{id}/commit:
    post:
      tags: [imports]
      operationId: commitImport
      summary: Promove as staged selecionadas a transações
      description: >-
        Para cada staged listada (PENDING), valida a sanidade (valor plausível, data coerente),
        cria a Transaction reusando o caminho de criação existente (débito→EXPENSE,
        crédito→INCOME; conta escolhida pelo usuário) e marca a staged CONFIRMED. O batch vira
        COMMITTED quando nenhuma staged fica mais PENDING.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCommitRequestDTO'
      responses:
        '200':
          description: Batch após o commit (COMMITTED se todas as staged foram resolvidas)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchResponseDTO'
        '400':
          description: Staged inválida para lançamento (valor/data ausente ou inconsistente)
        '404':
          description: Batch ou staged não encontrado (ou de outro tenant)
