server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Default do nginx é 1MB — bem abaixo do teto real do Spring (10MB/arquivo, 12MB/request,
    # application.properties). Sem isso, upload de imagem >1MB (print de extrato, por ex.) leva
    # 413 aqui e nunca chega no backend — falha silenciosa, sem log nenhum do lado da API.
    client_max_body_size 12m;

    # Fallback para rotas de SPA (Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para a API do backend
    location /api/ {
        proxy_pass http://fintech-core-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Default do nginx é 60s — a importação de extrato por IA faz até 2 chamadas
        # sequenciais ao Gemini (comprovante + extrato), e a 2ª sozinha já mediu 131s em
        # produção (extrato de 39 linhas). Sem isso, o nginx devolve 504 pro navegador e mata
        # a conexão bem antes do backend terminar — o usuário vê erro mesmo quando a extração
        # completa com sucesso do outro lado (achado em produção, 2026-08-26).
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Proxy reverso para as rotas de auth do backend
    location /auth/ {
        proxy_pass http://fintech-core-backend:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache Control para arquivos estáticos (1 ano de cache, hashing já garante invalidação)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # Evita cache do index.html para que o cliente sempre receba os novos nomes de arquivos hashados
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # env.js muda por deploy sem hash no nome (reescrito no boot do container).
    # Match exato vence o regex de cache de 1 ano dos .js acima.
    location = /env.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
