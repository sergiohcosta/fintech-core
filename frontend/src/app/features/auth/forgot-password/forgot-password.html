<div class="forgot-password-container">
  <mat-card class="forgot-password-card">

    @if (!submitted()) {
      <mat-card-header>
        <mat-card-title>Recuperar senha</mat-card-title>
        <mat-card-subtitle>Enviaremos um link de recuperação para o seu email</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>E-mail</mat-label>
            <input matInput type="email" formControlName="email" placeholder="seu@email.com">
          </mat-form-field>

          <button mat-flat-button color="primary" class="full-width submit-btn"
                  [disabled]="form.invalid || isLoading()">
            {{ isLoading() ? 'ENVIANDO...' : 'ENVIAR LINK' }}
          </button>
        </form>
      </mat-card-content>
    }

    @if (submitted()) {
      <mat-card-header>
        <mat-card-title>Verifique seu email</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>Se existir uma conta com este email, um link de recuperação foi enviado. O link expira em 1 hora.</p>
      </mat-card-content>
    }

    <mat-card-footer>
      <p><a routerLink="/login">Voltar ao login</a></p>
    </mat-card-footer>
  </mat-card>
</div>
