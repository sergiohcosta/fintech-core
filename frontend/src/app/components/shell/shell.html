<mat-toolbar color="primary" class="toolbar">
  <button mat-icon-button (click)="toggleSidenav()" aria-label="Abrir/fechar menu">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="toolbar-title">Nosso Dinheirinho</span>

  <span class="spacer"></span>

  <span class="user-name">{{ userName() }}</span>
  <button mat-icon-button (click)="logout()" matTooltip="Sair" aria-label="Sair">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    [mode]="sidenavMode()"
    [opened]="sidenavOpened() || sidenavOpen()"
    (openedChange)="sidenavOpen.set($event)"
    class="sidenav">
    <mat-nav-list>
      @for (section of navSections; track section.title; let first = $first) {
        @if (!first) {
          <mat-divider class="section-divider"></mat-divider>
        }
        @if (section.title) {
          <div mat-subheader class="nav-subheader">{{ section.title }}</div>
        }
        @for (item of section.items; track item.route) {
          @if (!item.adminOnly || isAdmin()) {
            <a mat-list-item
               [routerLink]="item.route"
               routerLinkActive="active-link"
               (click)="isCompact() && sidenavOpen.set(false)">
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
            </a>
          }
        }
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="content" tabindex="0">
      <router-outlet />
    </div>
    <app-bottom-tab-bar />
  </mat-sidenav-content>
</mat-sidenav-container>
