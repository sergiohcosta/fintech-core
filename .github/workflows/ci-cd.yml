name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Testes Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fintech
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Roda testes e empacota
        run: ./mvnw verify

  test-frontend:
    name: Testes Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Configura Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Instala dependências
        run: npm ci
      - name: Roda testes
        run: npm test
      - name: Build de produção
        run: npm run build -- --configuration=production

  # Build das imagens (backend + frontend) e push pro registry do homelab
  # (infra/registry, exposto via tailscale ingress). Roda no runner
  # self-hosted (dentro do k3s) — nunca em runner hospedado, pra não expor
  # kubeconfig em nenhum segredo do GitHub.
  build-and-push:
    name: Build & Push das imagens
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, k3s]
    env:
      # REGISTRY: hostname usado pelos manifests/kubelet pra *pull* (via
      # tailscale ingress, TLS válido) — precisa bater com o que o
      # deployment.yaml e o `kustomize edit set image` (job de deploy)
      # esperam.
      REGISTRY: registry.atlas-haddock.ts.net
      # REGISTRY_INTERNAL: usado só pelo *push* — verificado que o pod do
      # runner não resolve o hostname MagicDNS do tailscale (CoreDNS não
      # encaminha pro resolver dele), então o push usa o Service
      # cluster-local direto, em HTTP (--tls-verify=false; tráfego nunca
      # sai da rede do cluster). O nome do repo:tag armazenado é o mesmo
      # nos dois casos — o registry indexa por repo:tag, não pelo
      # hostname usado pra alcançá-lo — então o pull via REGISTRY externo
      # encontra a imagem normalmente.
      REGISTRY_INTERNAL: registry.infra.svc.cluster.local:5000
      SHA_TAG: sha-${{ github.sha }}
      # vfs em vez do overlay padrão: a raiz do pod do runner já é overlayfs
      # (containerd) e buildah não empilha overlay-sobre-overlay sem
      # fuse-overlayfs (que exigiria /dev/fuse + capability extra no pod,
      # contradizendo o motivo de evitar privilégio). vfs não precisa de
      # nenhum device especial — só copia camadas em vez de usar overlay,
      # mais lento e mais disco. Aceitável no volume de builds do projeto;
      # trocar por fuse-overlayfs só se isso virar gargalo real.
      STORAGE_DRIVER: vfs
    steps:
      - uses: actions/checkout@v4
      - name: Instala buildah
        run: sudo apt-get update -y && sudo apt-get install -y buildah
      - name: Build backend
        run: buildah bud -f backend/Dockerfile -t fintech-core-backend:$SHA_TAG .
      - name: Build frontend
        run: buildah bud -f frontend/Dockerfile -t fintech-core-frontend:$SHA_TAG .
      - name: Push backend
        run: buildah push --tls-verify=false fintech-core-backend:$SHA_TAG docker://$REGISTRY_INTERNAL/fintech-core-backend:$SHA_TAG
      - name: Push frontend
        run: buildah push --tls-verify=false fintech-core-frontend:$SHA_TAG docker://$REGISTRY_INTERNAL/fintech-core-frontend:$SHA_TAG

  # Deploy via kubectl no próprio runner (client-go cai pra InClusterConfig
  # automaticamente — sem kubeconfig nenhum, só o token da ServiceAccount
  # montado no pod). RBAC de gha-runner (homelab-k8s/infra/gha-runner/rbac.yaml)
  # restringe o alcance só ao namespace do ambiente.
  deploy-dev:
    name: Deploy (dev)
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, k3s]
    env:
      REGISTRY: registry.atlas-haddock.ts.net
      SHA_TAG: sha-${{ github.sha }}
    steps:
      - name: Gera token do GitHub App pra checkout do homelab-k8s
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: homelab-k8s
      - uses: actions/checkout@v4
        with:
          repository: sergiohcosta/homelab-k8s
          token: ${{ steps.app-token.outputs.token }}
      - uses: azure/setup-kubectl@v4
      - name: Instala kustomize
        run: curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash /dev/stdin /usr/local/bin
      - name: Aponta as imagens da run e aplica o overlay
        working-directory: projects/fintech-core/overlays/dev
        run: |
          kustomize edit set image \
            $REGISTRY/fintech-core-backend=$REGISTRY/fintech-core-backend:$SHA_TAG \
            $REGISTRY/fintech-core-frontend=$REGISTRY/fintech-core-frontend:$SHA_TAG
          kubectl apply -k .
      - name: Reinicia os deployments
        run: |
          kubectl rollout restart deployment/fintech-core-backend deployment/fintech-core-frontend -n dev

  deploy-hmg:
    name: Deploy (hmg)
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, k3s]
    env:
      REGISTRY: registry.atlas-haddock.ts.net
      SHA_TAG: sha-${{ github.sha }}
    steps:
      - name: Gera token do GitHub App pra checkout do homelab-k8s
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: homelab-k8s
      - uses: actions/checkout@v4
        with:
          repository: sergiohcosta/homelab-k8s
          token: ${{ steps.app-token.outputs.token }}
      - uses: azure/setup-kubectl@v4
      - name: Instala kustomize
        run: curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash /dev/stdin /usr/local/bin
      - name: Aponta as imagens da run e aplica o overlay
        working-directory: projects/fintech-core/overlays/hmg
        run: |
          kustomize edit set image \
            $REGISTRY/fintech-core-backend=$REGISTRY/fintech-core-backend:$SHA_TAG \
            $REGISTRY/fintech-core-frontend=$REGISTRY/fintech-core-frontend:$SHA_TAG
          kubectl apply -k .
      - name: Reinicia os deployments
        run: |
          kubectl rollout restart deployment/fintech-core-backend deployment/fintech-core-frontend -n hmg

  # Sem gate manual: main já é protegida por PR review, esse é o portão real.
  # Roda em sequência (needs: deploy-hmg) na mesma run, não em paralelo.
  deploy-prod:
    name: Deploy (prod)
    needs: deploy-hmg
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, k3s]
    env:
      REGISTRY: registry.atlas-haddock.ts.net
      SHA_TAG: sha-${{ github.sha }}
    steps:
      - name: Gera token do GitHub App pra checkout do homelab-k8s
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: homelab-k8s
      - uses: actions/checkout@v4
        with:
          repository: sergiohcosta/homelab-k8s
          token: ${{ steps.app-token.outputs.token }}
      - uses: azure/setup-kubectl@v4
      - name: Instala kustomize
        run: curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash /dev/stdin /usr/local/bin
      - name: Aponta as imagens da run e aplica o overlay
        working-directory: projects/fintech-core/overlays/prod
        run: |
          kustomize edit set image \
            $REGISTRY/fintech-core-backend=$REGISTRY/fintech-core-backend:$SHA_TAG \
            $REGISTRY/fintech-core-frontend=$REGISTRY/fintech-core-frontend:$SHA_TAG
          kubectl apply -k .
      - name: Reinicia os deployments
        run: |
          kubectl rollout restart deployment/fintech-core-backend deployment/fintech-core-frontend -n prod
