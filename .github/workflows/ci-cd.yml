name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Testes Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fintech
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # RLS (#116, ADR-006): spring.profiles.active=local (default) faz o runtime da app
      # conectar como fintech_app (role sem SUPERUSER — superuser bypassa RLS mesmo com
      # FORCE). O Postgres do CI nasce vazio, só com o role "admin" definido acima; sem este
      # passo, todo @SpringBootTest falha na conexão (fintech_app não existe). Mesmo script
      # que o docker-compose local monta em /docker-entrypoint-initdb.d — fonte única.
      - name: Cria role fintech_app (runtime não-superuser, ver .docker/postgres-init)
        env:
          PGPASSWORD: secret
        run: psql -h localhost -U admin -d fintech -f ../.docker/postgres-init/01-app-role.sql
      - name: Roda testes e empacota
        run: ./mvnw verify

  test-frontend:
    name: Testes Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Configura Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Instala dependências
        run: npm ci
      - name: Roda testes
        run: npm test
      - name: Build de produção
        run: npm run build -- --configuration=production

  # Build das imagens (backend + frontend) e push pro GHCR (ghcr.io).
  # Roda em runner GitHub-hosted (rede estável pro GitHub) — antes era
  # self-hosted no k3s, mas o runner do homelab perdia a conexão de controle
  # com o GitHub em builds longos (SSL drop, #153). GitHub-hosted fala com o
  # GitHub pela rede do próprio GitHub, então esse modo de falha some. O push
  # vai pro GHCR (autenticado pelo GITHUB_TOKEN embutido, zero segredo novo);
  # como o repo é público, os packages são públicos e o kubelet do homelab
  # puxa sem imagePullSecret. Só os jobs deploy-* seguem self-hosted (precisam
  # de acesso ao cluster; são curtos e imunes ao #153).
  build-and-push:
    name: Build & Push das imagens
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # packages: write é o que autoriza o push pro GHCR com o GITHUB_TOKEN.
    permissions:
      contents: read
      packages: write
    env:
      # REGISTRY = base do repo no GHCR (dono em minúsculo, exigência do GHCR).
      # Mesmo valor usado pelos jobs de deploy no `kustomize edit set image`,
      # pra o nome da imagem casar entre build e deploy.
      REGISTRY: ghcr.io/sergiohcosta
      SHA_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      # Login no GHCR: o login-action escreve ~/.docker/config.json, que o Jib
      # e o buildx leem pra autenticar o push — nenhuma credencial extra.
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Backend via Jib (plugin Maven): builda direto do bytecode compilado,
      # sem Dockerfile/daemon. Só o destino do -Dimage mudou pro GHCR.
      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build & push backend (Jib)
        working-directory: ./backend
        # jib.httpTimeout: o default do Jib é 20s de read timeout, que estourava
        # (SocketTimeoutException: Read timed out) no push das layers pro GHCR.
        # 180s dá folga sem risco de travar indefinidamente (o job tem teto).
        run: ./mvnw -B compile jib:build -Dimage=$REGISTRY/fintech-core-backend:$SHA_TAG -Djib.httpTimeout=180000
      # Frontend via buildx: o runner GitHub-hosted tem daemon Docker, então
      # não precisa mais do kaniko (que existia só pra buildar em userspace
      # puro na ausência de daemon no pod self-hosted). Some crane, kaniko e
      # os contornos de ulimit/snapshot. O contexto é a raiz do repo — o
      # frontend/Dockerfile faz COPY de frontend/... a partir dela.
      - name: Configura buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          # APP_SHA é assado na imagem (marca d'água). Ambiente/versão SemVer são
          # injetados no deploy (deploy-env.yml), pois a mesma imagem serve os 3 envs.
          build-args: |
            APP_SHA=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/fintech-core-frontend:${{ env.SHA_TAG }}

  # Scan de CVE/SBOM das imagens buildadas (#166). Roda DEPOIS do push pro GHCR
  # (needs: build-and-push) para escanear a imagem exata que será deployada.
  #
  # Política: BLOQUEAR crítico. `severity: CRITICAL,HIGH` filtra o que é reportado e
  # `exit-code: 1` faz o job FALHAR quando há CVE nesses níveis — a imagem contaminada
  # fica visível no log (tabela de CVEs) e o pipeline acusa o erro. `ignore-unfixed: true`
  # não falha em vulnerabilidade sem fix publicado (reporta, mas não trava o pipeline
  # refém do fornecedor — bloquear sem remediar disponível só geraria ruído).
  #
  # Pin por SHA imutável (57a97c7... = v0.35.0): a tag "0.28.0" foi force-pushada com
  # infostealer no ataque de supply chain de mar/2026 (GHSA-69fq-xp46-6x23 /
  # CVE-2026-33634) e removida na remediação — não existe mais. v0.35.0 é a ÚNICA tag
  # que nunca foi comprometida (imutável desde 04/mar/2026); pinar por SHA elimina o
  # risco de tag hijacking num passo cuja função é justamente segurança.
  trivy-scan:
    name: Scan de CVE (Trivy)
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REGISTRY: ghcr.io/sergiohcosta
      SHA_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      # Login no GHCR pra o Trivy autenticar o pull das imagens (mesmo padrão do
      # build-and-push; packages do repo público também permitem pull anônimo, mas
      # autenticar evita rate-limit e é a prática padrão de CI).
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan backend (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/fintech-core-backend:${{ env.SHA_TAG }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: table
      - name: Scan frontend (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/fintech-core-frontend:${{ env.SHA_TAG }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: table

  # Deploy verificado via reusable workflow (.github/workflows/deploy-env.yml):
  # cada ambiente faz apply + gate de rollout + smoke test + rollback automático.
  # Roda no runner self-hosted (InClusterConfig + RBAC do gha-runner por namespace).
  # `secrets: inherit` repassa GH_APP_ID/GH_APP_PRIVATE_KEY pro checkout do homelab-k8s.
  deploy-dev:
    name: Deploy (dev)
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy-env.yml
    with:
      namespace: dev
    secrets: inherit

  deploy-hmg:
    name: Deploy (hmg)
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-env.yml
    with:
      namespace: hmg
    secrets: inherit

  # Gate manual do prod: passar `environment: prod` faz o job do reusable workflow
  # PAUSAR aguardando aprovação de reviewer (Settings → Environments → prod). Roda
  # em sequência (needs: deploy-hmg) na mesma run — mesmo SHA_TAG já validado em hmg.
  # Ver commands.md ("Deploy manual (prod)") pra aprovar/rejeitar.
  deploy-prod:
    name: Deploy (prod)
    needs: deploy-hmg
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-env.yml
    with:
      namespace: prod
      environment: prod
    secrets: inherit
